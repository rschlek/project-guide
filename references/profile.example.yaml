# Example profile, one per user on each machine. The profile skill writes one from
# your answers; or copy this, fill in real values, and point the skills at the copy
# (environment variable PROJECT_GUIDE_PROFILE, or a one-line ~/.project-guide file
# holding the path).

projects_root: ~/projects          # flat folder holding every project
worktrees_dir: .claude/worktrees   # where worktrees nest inside a project

shared_namespaces:                 # optional: remote namespaces of repos other people use; sync sends their updates through review
  - example-team                   # or host/namespace, such as git.example.com/example-team

scopes:
  team:
    meaning: projects the team owns
    prefix: true                   # new project names start with "team-"
    host: git.example.com
    namespace: example-user
  lab:
    meaning: one group's experiments
    prefix: true
    host: git.example.com
    namespace: example-user
  personal:
    meaning: personal projects
    prefix: false                  # personal projects take no prefix
    host: code.example.org
    namespace: example-user

tracker:                           # the default tracker, for a project that declares none
  kind: example-tracker            # a kind that has a recipe (a skill to create, read, update, close a ticket)
  url: https://tracker.example.com/browse/{key}

memory:                            # where each memory kind lives; project.yaml names only the kind
  personal:
    kind: example-memory
    location: example-personal-store
  shared:                          # where context for collaborators is published
    kind: example-memory
    location: example-shared-store
  # repo needs no entry: the project keeps only what the Documents rules allow in its repository
